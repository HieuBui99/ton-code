[project]
name = "ton-code"
version = "0.1.0"
description = "A minimal coding agent with an append-style terminal interface"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bs4>=0.0.2",
    "click>=8.5.0",
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "pydantic>=2.13.5",
    "pydantic-ai>=2.43.0",
    "pydantic-settings>=2.0.0",
    "prompt-toolkit>=3.0.52,<4",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
]

[project.scripts]
ton-code = "src.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]
